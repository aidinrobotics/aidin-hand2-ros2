# Isaac 브리지 전용 controller 설정. command interface 계약은 실 hardware 와 동일하므로 basic
# controller 4종을 모두 load 할 수 있고, state 계약도 동일해 hand_state/diagnostics broadcaster 도
# 그대로 붙는다(mock 과 다른 점 — controllers_mock.yaml 은 두 broadcaster 를 뺀다).
# glove_teleop_controller 는 launch 에서 --param-file 로 별도 spawn 한다.

controller_manager:
  ros__parameters:
    # 시뮬레이터 물리 스텝과 맞물리는 루프라 실 SDK 의 500Hz 를 그대로 쓸 이유는 없지만,
    # 컨트롤러 튜닝을 실기와 공유하려면 같은 값이 편하다.
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_hand_state_broadcaster:
      type: aidin_hand2_controllers/HandStateBroadcaster
    left_diagnostics_broadcaster:
      type: aidin_hand2_controllers/DiagnosticsBroadcaster
    left_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    left_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController
    left_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    left_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController

    # 글러브 텔레오퍼(옵션, use_glove:=true 일 때 spawn). 파라미터는 glove_teleop_controller.yaml 에서.
    left_glove_teleop_controller:
      type: aidin_hand2_examples/GloveTeleopController

# rviz/TF 용 표준 joint_state_broadcaster — 사람 눈용이라 100Hz 로 충분.
joint_state_broadcaster:
  ros__parameters:
    update_rate: 100

left_hand_state_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 100
left_diagnostics_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 20
left_joint_position_controller:
  ros__parameters:
    hand_side: "left"
    speed_rad_s: 0.0      # 0 = 즉시 추종.
left_joint_impedance_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_position_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_effort_controller:
  ros__parameters:
    hand_side: "left"
