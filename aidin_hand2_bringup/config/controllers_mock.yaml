# Mock controller setup
# The command interface contract matches the real hardware, so all four command controllers load
# The mock exports what the hand state and diagnostics broadcasters claim, so a GUI can follow it:
# zero tactile, Running and homed, and the joint position command echoed
# Both hands are defined here, use_left_hand and use_right_hand pick which one is spawned

# ----------------------------- Controller manager ----------------------------

controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_hand_state_broadcaster:
      type: aidin_hand2_controllers/HandStateBroadcaster
    left_diagnostics_broadcaster:
      type: aidin_hand2_controllers/DiagnosticsBroadcaster
    right_hand_state_broadcaster:
      type: aidin_hand2_controllers/HandStateBroadcaster
    right_diagnostics_broadcaster:
      type: aidin_hand2_controllers/DiagnosticsBroadcaster

    left_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    left_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController
    left_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    left_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController

    right_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    right_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController
    right_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    right_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController

# ----------------------------- Joint state broadcaster -----------------------

# One for the whole robot, feeding rviz and TF
joint_state_broadcaster:
  ros__parameters:
    update_rate: 100

# --------------------------------- Left hand ---------------------------------

# The same rates as controllers.yaml
left_hand_state_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 100
left_diagnostics_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 20
left_joint_position_controller:
  ros__parameters:
    hand_side: "left"
left_joint_impedance_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_position_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_effort_controller:
  ros__parameters:
    hand_side: "left"

# --------------------------------- Right hand --------------------------------

right_hand_state_broadcaster:
  ros__parameters:
    hand_side: "right"
    update_rate: 100
right_diagnostics_broadcaster:
  ros__parameters:
    hand_side: "right"
    update_rate: 20
right_joint_position_controller:
  ros__parameters:
    hand_side: "right"
right_joint_impedance_controller:
  ros__parameters:
    hand_side: "right"
right_actuator_position_controller:
  ros__parameters:
    hand_side: "right"
right_actuator_effort_controller:
  ros__parameters:
    hand_side: "right"
