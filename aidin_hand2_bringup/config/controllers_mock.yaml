# Mock controller setup
# The command interface contract matches the real hardware, so all four command controllers load
# The hand state and diagnostics broadcasters are left out, the mock models no sensor
# Both hands are defined here, use_left_hand and use_right_hand pick which one is spawned

# ----------------------------- Controller manager ----------------------------

controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    left_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController
    left_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    left_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController

    right_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    right_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController
    right_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    right_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController

# --------------------------------- Left hand ---------------------------------

left_joint_position_controller:
  ros__parameters:
    hand_side: "left"
left_joint_impedance_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_position_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_effort_controller:
  ros__parameters:
    hand_side: "left"

# --------------------------------- Right hand --------------------------------

right_joint_position_controller:
  ros__parameters:
    hand_side: "right"
right_joint_impedance_controller:
  ros__parameters:
    hand_side: "right"
right_actuator_position_controller:
  ros__parameters:
    hand_side: "right"
right_actuator_effort_controller:
  ros__parameters:
    hand_side: "right"
