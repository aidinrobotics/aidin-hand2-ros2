# Both hands are defined here, the spawner starts only the ones in use
# update_rate has to match the hardware RT loop, a lower rate turns the target into steps
# A broadcaster publishes every update unless it takes its own update_rate

# ----------------------------- Controller manager ----------------------------

controller_manager:
  ros__parameters:
    update_rate: 500

    # RT options for the control thread, uncomment to suit the machine
    # SCHED_FIFO priority stays at the default 50, below the hardware RT loop at 80
    # lock_memory: true     # mlockall
    # cpu_affinity: 6       # A core apart from the one rt_cpu_affinity pins

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_hand_state_broadcaster:
      type: aidin_hand2_controllers/HandStateBroadcaster
    left_diagnostics_broadcaster:
      type: aidin_hand2_controllers/DiagnosticsBroadcaster
    left_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    left_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    left_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController
    left_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController

    right_hand_state_broadcaster:
      type: aidin_hand2_controllers/HandStateBroadcaster
    right_diagnostics_broadcaster:
      type: aidin_hand2_controllers/DiagnosticsBroadcaster
    right_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    right_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    right_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController
    right_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController

# ----------------------------- Joint state broadcaster -----------------------

# One for the whole robot, feeding rviz and TF
joint_state_broadcaster:
  ros__parameters:
    update_rate: 100

# --------------------------------- Left hand ---------------------------------

# <side>_hand_control is the hardware component's own node, named after <ros2_control name>
# These are the initial values, and `ros2 param set /left_hand_control <name> <value>` changes
# them from the next cycle on
# An array takes 1 value shared by every actuator or 16 for one each
left_hand_control:
  ros__parameters:
    # rated current %, 0~2000
    max_effort: [1000.0, 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0]
    joint_position_controller:
      filter_enabled: true            # false takes the target straight through
      cutoff_freq: 10.0               # Hz, at most half the rate the target arrives at
      deadband: 0.000873              # rad, 0.05°
    joint_impedance_controller:
      stiffness: [0.02, 0.02, 0.02, 0.02,
                  0.01, 0.01, 0.02,
                  0.01, 0.01, 0.02,
                  0.01, 0.01, 0.02,
                  0.01, 0.01, 0.02]
      damping: [1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5]

# A per-controller update_rate holds the broadcasters below the controller_manager rate
left_hand_state_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 100
left_diagnostics_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 20
left_joint_position_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_position_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_effort_controller:
  ros__parameters:
    hand_side: "left"
left_joint_impedance_controller:
  ros__parameters:
    hand_side: "left"

# --------------------------------- Right hand --------------------------------

right_hand_control:
  ros__parameters:
    max_effort: [1000.0, 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0,
                 1000.0, 1000.0, 1000.0]
    joint_position_controller:
      filter_enabled: true
      cutoff_freq: 10.0
      deadband: 0.000873
    joint_impedance_controller:
      stiffness: [0.02, 0.02, 0.02, 0.02,
                  0.01, 0.01, 0.02,
                  0.01, 0.01, 0.02,
                  0.01, 0.01, 0.02,
                  0.01, 0.01, 0.02]
      damping: [1.0e-5, 1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5,
                1.0e-5, 1.0e-5, 1.0e-5]

right_hand_state_broadcaster:
  ros__parameters:
    hand_side: "right"
    update_rate: 100
right_diagnostics_broadcaster:
  ros__parameters:
    hand_side: "right"
    update_rate: 20
right_joint_position_controller:
  ros__parameters:
    hand_side: "right"
right_actuator_position_controller:
  ros__parameters:
    hand_side: "right"
right_actuator_effort_controller:
  ros__parameters:
    hand_side: "right"
right_joint_impedance_controller:
  ros__parameters:
    hand_side: "right"
