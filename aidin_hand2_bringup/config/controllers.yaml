# controller_manager + 컨트롤러 6종 파라미터. 왼손(left_)·오른손(right_) 인스턴스를 모두 정의하고,
# spawner 가 실제로 사용하는 손의 것만 기동한다(사용 안 하는 손 인스턴스는 무시됨).
#
# update_rate 는 SDK RT loop(기본 500Hz)와 반드시 맞춘다 — 낮으면 계단 지령이 되어 진동한다.
# broadcaster 는 매 update 발행. 발행만 낮추려면 해당 broadcaster 에 표준 update_rate 파라미터를 준다.
controller_manager:
  ros__parameters:
    update_rate: 500

    # CM 제어 스레드(read→update→write) RT 옵션 — 장비에 맞춰 해제해 사용.
    # SCHED_FIFO 우선순위는 기본 50 (SDK RT loop 80 보다 낮음) 그대로 둔다.
    # lock_memory: true     # mlockall — 프로세스 전체 페이지 폴트 방지
    # cpu_affinity: 6       # CM 스레드 코어 pin — SDK loop 코어(rt_cpu_affinity)와 분리

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_hand_state_broadcaster:
      type: aidin_hand2_controllers/HandStateBroadcaster
    left_diagnostics_broadcaster:
      type: aidin_hand2_controllers/DiagnosticsBroadcaster
    left_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    left_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    left_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController
    left_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController
    # 글러브 텔레오퍼(옵션, 별도 spawn). 파라미터는 aidin_hand2_examples/config/glove_teleop/glove_teleop_controller.yaml.
    left_glove_teleop_controller:
      type: aidin_hand2_examples/GloveTeleopController

    right_hand_state_broadcaster:
      type: aidin_hand2_controllers/HandStateBroadcaster
    right_diagnostics_broadcaster:
      type: aidin_hand2_controllers/DiagnosticsBroadcaster
    right_joint_position_controller:
      type: aidin_hand2_controllers/JointPositionController
    right_actuator_position_controller:
      type: aidin_hand2_controllers/ActuatorPositionController
    right_actuator_effort_controller:
      type: aidin_hand2_controllers/ActuatorEffortController
    right_joint_impedance_controller:
      type: aidin_hand2_controllers/JointImpedanceController

# rviz/TF 용 표준 joint_state_broadcaster — 사람 눈용이라 100Hz 로 충분(500Hz 불필요).
joint_state_broadcaster:
  ros__parameters:
    update_rate: 100

# ── 왼손 ──
# broadcaster 발행 rate 는 CM update_rate(500) 를 그대로 안 따르고 per-controller update_rate 로
# 낮춘다 — GUI/rviz 는 사람 눈용이라 100Hz 면 충분하고, 500Hz 는 rosbridge_server 가 양손 무거운
# 메시지를 초당 1000개 구독·직렬화하며 포화돼 GUI 가 지연(렉)된다. diagnostics 는 더 낮게(20Hz).
left_hand_state_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 100
left_diagnostics_broadcaster:
  ros__parameters:
    hand_side: "left"
    update_rate: 20
left_joint_position_controller:
  ros__parameters:
    hand_side: "left"
    speed_rad_s: 0.0      # 0 = 즉시 추종.
left_actuator_position_controller:
  ros__parameters:
    hand_side: "left"
left_actuator_effort_controller:
  ros__parameters:
    hand_side: "left"
left_joint_impedance_controller:
  ros__parameters:
    hand_side: "left"
    # stiffness / damping 은 생략 시 SDK 그룹 기본값(kDefaultStiffness/kDefaultDamping)을 쓴다.

# ── 오른손 ──
right_hand_state_broadcaster:
  ros__parameters:
    hand_side: "right"
    update_rate: 100
right_diagnostics_broadcaster:
  ros__parameters:
    hand_side: "right"
    update_rate: 20
right_joint_position_controller:
  ros__parameters:
    hand_side: "right"
    speed_rad_s: 0.0
right_actuator_position_controller:
  ros__parameters:
    hand_side: "right"
right_actuator_effort_controller:
  ros__parameters:
    hand_side: "right"
right_joint_impedance_controller:
  ros__parameters:
    hand_side: "right"
