# Launch arguments for aidin_hand2.launch.py, one key per argument
# These values override the argument defaults, and key:=value on the command line overrides these
#
#   ros2 launch aidin_hand2_bringup aidin_hand2.launch.py config:=<path>
#
# Controller and controller_manager parameters are in controllers.yaml instead

# ----------------------------------- Hands -----------------------------------

use_left_hand: true
use_right_hand: true

# ------------------------------- CAN interface -------------------------------

left_hand_interface: can0
right_hand_interface: can1

# ----------------------------- Disabled actuator -----------------------------

# Comma separated index list such as "7,8", empty leaves every actuator on
# A disabled actuator is never enabled, never reported as a fault, and never homed
# 0 thumb_actuator0    4 index_actuator1    7 middle_actuator1   10 ring_actuator1   13 baby_actuator1
# 1 thumb_actuator1    5 index_actuator2    8 middle_actuator2   11 ring_actuator2   14 baby_actuator2
# 2 thumb_actuator2    6 index_actuator3    9 middle_actuator3   12 ring_actuator3   15 baby_actuator3
# 3 thumb_actuator3
left_hand_disabled_actuators: ""
right_hand_disabled_actuators: ""

# ---------------------------------- RT loop ----------------------------------

# Core the RT loop is pinned to, -1 = unset
left_hand_cpu_affinity: -1
right_hand_cpu_affinity: -1

# ----------------------------------- Homing ----------------------------------

# The hand moves right after startup
auto_home: true

# ------------------------------- Auto reconnect ------------------------------

auto_reconnect: false
auto_reconnect_timeout_ms: 0   # ms before giving up, 0 = no limit
auto_reconnect_home: false     # Homing before run on recovery
