# Skeleton claiming the JointImpedanceController reference, position x16
# Only one of the four in this directory can be active at a time
controller_manager:
  ros__parameters:
    left_joint_impedance_upper:
      type: aidin_hand2_examples/JointImpedanceUpperController

left_joint_impedance_upper:
  ros__parameters:
    hand_side: left
    target_controller: left_joint_impedance_controller
    # The mock exports no tactile state interface, set true on the robot hand to read tactile
    read_tactile: false
