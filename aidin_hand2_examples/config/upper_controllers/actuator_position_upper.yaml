# Skeleton claiming the ActuatorPositionController reference, position_cnt x16
# Only one of the four in this directory can be active at a time
controller_manager:
  ros__parameters:
    left_actuator_position_upper:
      type: aidin_hand2_examples/ActuatorPositionUpperController

left_actuator_position_upper:
  ros__parameters:
    hand_side: left
    target_controller: left_actuator_position_controller
    hand_state_topic: /left_hand_state_broadcaster/hand_state
